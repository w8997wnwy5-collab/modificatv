name: Check and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lg-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLEANFRAME_PUBLIC_FONTS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run check:public
      - run: npx playwright install --with-deps chromium
      - run: npm run check:browser
      - run: npm run package
      # The installable LG package, with the notices that travel with it.
      - uses: actions/upload-artifact@v7
        with:
          name: CleanFrame-LG-webOS
          path: |
            dist/*.ipk
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
